<div class="w-full min-h-screen">
  <div class="max-w-[1440px]! mx-auto pt-8 px-3">
    <div>
      <div class="w-full flex justify-center">
        <div class="w-full max-w-4xl flex flex-col pt-12">
          <div class="flex gap-3 items-center pb-3">
            <p class="text-sm">{{post?.date}}</p> |
            <p class="text-sm"> {{post?.readingTime}} de leitura</p>
          </div>
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-emerald-900 leading-tight">{{ post?.title }}</h1>
        </div>
      </div>

      <div class="flex flex-col items-center mt-6">
        <div class="w-full max-w-4xl">
          <!-- Container da imagem responsivo com proporção 1:1 -->
          <div class="w-full max-w-md sm:max-w-lg md:max-w-xl lg:max-w-2xl mx-auto mb-8">
            <div class="aspect-square rounded-lg overflow-hidden shadow-md">
              <img
                [src]="post?.imageUrl"
                alt=""
                class="w-full h-full object-cover"
              >
            </div>
          </div>

          <!-- Conteúdo do post -->
          <div [innerHTML]="getSafeHtml(post?.description || '')" class="keep-html prose prose-lg max-w-none"></div>
        </div>
      </div>
    </div>
  </div>
</div>
