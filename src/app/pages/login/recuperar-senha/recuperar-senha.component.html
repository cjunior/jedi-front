<div class="login-container">
    <div class="image-container"></div>
    <div class="login-card">
      <div class="flex flex-col items-center gap-1">
        <h1>RECUPERAR SENHA</h1>
        <p>Digite seu email para receber as instruções de recuperação</p>
      </div>
  
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col">
        <!-- Email -->
        <p-floatLabel variant="on">
          <input
            id="email"
            pInputText
            pSize="large"
            autocomplete="off"
            class="w-full"
            formControlName="email"
          />
          <label for="email">Email</label>
        </p-floatLabel>
        @if(submitted() && form.controls.email.errors) {
          <p-message
            class="pt-1"
            severity="error"
            text="Email inválido"
            variant="simple"
            size="small"
          ></p-message>
        }
  
        <!-- Botão -->
        <button
          pButton
          type="submit"
          label="Enviar instruções"
          class="bg-emerald-800! hover:bg-emerald-900! border-emerald-700! mt-4"
          [loading]="isLoading()"
        ></button>
      </form>
  
      <div class="mt-4 text-center">
        <a routerLink="/login" class="back-to-login">
          ← Voltar para <strong>login</strong>
        </a>
      </div>
    </div>
  </div>
  
  <p-toast />
