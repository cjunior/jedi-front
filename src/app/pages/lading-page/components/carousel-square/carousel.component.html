<!-- Carrossel personalizado para desktop/tablet -->
<div *ngIf="!isMobile" class="relative w-full mx-auto flex items-center justify-center py-8">

  <!-- Botão seta esquerda -->
  <button (click)="previous()" class="absolute left-2 z-30 p-0 m-0 bg-transparent border-none cursor-pointer arrow-left">
    <svg xmlns="http://www.w3.org/2000/svg" fill="#CCC82E" viewBox="0 0 24 24" width="100" height="180">
      <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z" />
    </svg>
  </button>

  <!-- Container dos slides com animação -->
  <div class="carousel-container overflow-hidden z-10">
    <div 
      class="carousel-wrapper flex gap-4 transition-transform duration-500 ease-in-out"
      [style.transform]="'translateX(' + translateX + 'px)'"
    >
      <ng-container *ngFor="let slide of slides; let i = index">
        <div class="carousel-slide flex-shrink-0 relative rounded-md shadow-md overflow-hidden">
          
          <!-- Se for imagem -->
          <img
            *ngIf="slide.type === 'image'"
            [src]="slide.imageUrl"
            alt="Slide"
            class="w-full h-full object-cover"
          />
          
          <!-- Faixa superior sobreposta à imagem -->
          <div class="absolute top-0 left-0 w-full px-4 py-2 flex items-center justify-center gap-3 z-20" 
               style="background-color: #efc209; height: 50px;">
            <!-- Ícone de play -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#426b53">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Texto -->
            <span class="text-xl font-bold text-center" style="color: #426b53;">{{ slide.text }}</span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Botão seta direita -->
  <button (click)="next()" class="absolute right-2 z-30 p-0 m-0 bg-transparent border-none cursor-pointer arrow-right">
    <svg xmlns="http://www.w3.org/2000/svg" fill="#CCC82E" viewBox="0 0 24 24" width="100" height="180">
      <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
    </svg>
  </button>
</div>

<!-- Carrossel PrimeNG para mobile -->
<div *ngIf="isMobile" class="mobile-carousel py-8">
  <p-carousel 
    [value]="slides" 
    [numVisible]="1" 
    [numScroll]="1"
    [circular]="true"
    [showIndicators]="false"
    [showNavigators]="true"
    [responsiveOptions]="[
      {
        breakpoint: '600px',
        numVisible: 1,
        numScroll: 1
      }
    ]"
  >
    <ng-template pTemplate="item" let-slide>
      <div class="mobile-slide relative rounded-md shadow-md overflow-hidden mx-2">
        <!-- Se for imagem -->
        <img
          *ngIf="slide.type === 'image'"
          [src]="slide.imageUrl"
          alt="Slide"
          class="w-full h-full object-cover"
        />
        
        <!-- Faixa superior sobreposta à imagem -->
        <div class="absolute top-0 left-0 w-full px-4 py-2 flex items-center justify-center gap-3 z-20" 
             style="background-color: #efc209; height: 50px;">
          <!-- Ícone de play -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#426b53">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <!-- Texto -->
          <span class="text-lg font-bold text-center" style="color: #426b53;">{{ slide.text }}</span>
        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>
