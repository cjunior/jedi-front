<div class="card">
  <!-- Desktop/Tablet: 3 por vez -->
  <p-carousel 
    *ngIf="!isMobile"
    [value]="items" 
    [numVisible]="3" 
    [numScroll]="1" 
    [responsiveOptions]="responsiveOptions"
    [showIndicators]="false">
    <ng-template let-item pTemplate="item">
      <div class="rectangle-container">
        <div class="content">
          <svg class="play-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5v14l11-7z" fill="#426b53"/>
          </svg>
          <h1>{{ item.text }}</h1>
        </div>
        <img [src]="item.image" [alt]="item.alt" class="rectangle-image" />
      </div>
    </ng-template>
  </p-carousel>

  <!-- Mobile: 1 por vez -->
  <p-carousel 
    *ngIf="isMobile"
    class="mobile-carousel"
    [value]="items" 
    [numVisible]="1" 
    [numScroll]="1" 
    [showIndicators]="false"
    [responsiveOptions]="responsiveOptions">
    <ng-template let-item pTemplate="item">
      <div class="mobile-item">
        <div class="content">
          <svg class="play-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5v14l11-7z" fill="#426b53"/>
          </svg>
          <h1>{{ item.text }}</h1>
        </div>
        <div class="item">
          <img [src]="item.image" [alt]="item.alt" />
        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>
