<div class="card">
  <p-carousel
    class="carousel-equipe"
    [value]="displayItems"
    [numVisible]="3"
    [numScroll]="1"
    [responsiveOptions]="responsiveOptions"
    [showIndicators]="false"
    [circular]="true"
    [autoplayInterval]="0"
    [page]="currentPage"
    (onPage)="onPageChange($event)"
    (mouseenter)="pauseAutoplay()"
    (mouseleave)="resumeAutoplay()"
    (keydown)="pauseAutoplayPermanently()"
  >
    <ng-template let-item let-i="index" pTemplate="item">
      <div class="circle-container" (click)="pauseAutoplayPermanently()" (keydown)="pauseAutoplayPermanently()">
        <img [src]="item.image" [alt]="item.alt" class="circle-image" />
      </div>
    </ng-template>
  </p-carousel>

  <div class="middle-person-info">
    <h3>{{ currentMiddleItem.name }}</h3>
    <p>{{ currentMiddleItem.role }}</p>
  </div>
</div>
