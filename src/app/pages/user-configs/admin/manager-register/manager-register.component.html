<div class="p-8 mx-auto space-y-8">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg text-zinc-700">Gerenciar Usuários</h3>
    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Adicionar Usuário"
      class="!bg-emerald-800 hover:bg-emerald-900 !border-emerald-700"
      (click)="openAddUserDialog()"
    ></button>
  </div>

  <p-panel showHeader="false">
    <p-table
      #dt
      [value]="usuarios || []"
      [paginator]="true"
      [rows]="5"
      stripedRows
      scrollable="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="min-w-48">Nome</th>
          <th class="min-w-48">Email</th>
          <th class="min-w-24">Foto</th>
          <th class="min-w-32">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-usuario let-i="rowIndex">
        <tr>
          <td [title]="usuario.nome">{{ usuario.nome }}</td>
          <td [title]="usuario.email">{{ usuario.email }}</td>
          <td>
            <img
              [src]="usuario.foto"
              class="w-10 h-10 object-cover rounded-full"
            />
          </td>
          <td>
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-text mr-2"
              (click)="editarUsuario(usuario, i)"
              pTooltip="Editar usuário"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-text"
              (click)="excluirUsuario($event, i)"
              pTooltip="Excluir usuário"
            ></button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">Nenhum usuário encontrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-panel>

  <p-dialog
    header="Adicionar Usuário"
    [(visible)]="addUserDialogVisible"
    [modal]="true"
    [style]="{ width: '500px' }"
    [closable]="true"
  >
    <form [formGroup]="usuarioForm" class="space-y-4">
      <div class="flex flex-col items-center space-y-3">
        <div
          class="w-32 h-32 rounded-full border-2 border-dashed border-gray-300 bg-gray-100 overflow-hidden cursor-pointer hover:border-gray-400 transition-colors"
          (click)="fileInput.click()"
          (keydown.enter)="fileInput.click()"
          (keydown.space)="fileInput.click()"
          tabindex="0"
          role="button"
          aria-label="Selecionar foto"
        >
          <img
            *ngIf="fotoPreview"
            [src]="fotoPreview"
            alt="Preview da foto do usuário"
            class="w-full h-full object-cover"
          />
          <div
            *ngIf="!fotoPreview"
            class="w-full h-full flex items-center justify-center text-gray-400 text-sm"
          >
            <i class="pi pi-camera text-2xl"></i>
          </div>
        </div>

        <input
          #fileInput
          type="file"
          accept="image/*"
          (change)="onFileSelect($event)"
          class="hidden"
        />

        <span class="text-xs text-gray-500">Clique para selecionar foto</span>
      </div>

      <div class="flex flex-col ">
        <label for="nome" class="font-semibold text-gray-700 required">Nome Completo</label>
        <input
          type="text"
          id="nome"
          formControlName="nome"
          pInputText
          placeholder="Nome completo"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(usuarioForm, 'nome')"
        />
        <div *ngFor="let error of getFieldErrors(usuarioForm, 'nome')" class="mt-1">
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="login" class="font-semibold text-gray-700 required">Email/Login</label>
        <input
          type="email"
          id="login"
          formControlName="login"
          pInputText
          placeholder="email@exemplo.com"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(usuarioForm, 'login')"
        />
        <div *ngFor="let error of getFieldErrors(usuarioForm, 'login')" class="mt-1">
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="password" class="font-semibold text-gray-700 required">Senha</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          pInputText
          placeholder="Senha (min. 6 caracteres)"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(usuarioForm, 'password')"
        />
        <div *ngFor="let error of getFieldErrors(usuarioForm, 'password')" class="mt-1">
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
        <small class="text-gray-500 mt-1">
          A senha deve conter: 1 maiúscula, 1 minúscula e 1 número (mínimo 6 caracteres)
        </small>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button
        pButton
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-text"
        (click)="closeAddUserDialog()"
      ></button>
      <button
        pButton
        label="Criar Usuário"
        icon="pi pi-check"
        class="!bg-emerald-800 hover:bg-emerald-900 !border-emerald-700"
        (click)="criarUsuario()"
        [loading]="isLoading"
        [disabled]="!usuarioForm.valid || isLoading"
      ></button>
    </ng-template>
  </p-dialog>

  <p-dialog
    header="Editar Usuário"
    [(visible)]="editDialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
    [closable]="true"
  >
    <form [formGroup]="editForm" class="space-y-4">
      <div class="flex flex-col items-center space-y-3">
        <div
          class="w-24 h-24 rounded-full border-2 border-dashed border-gray-300 bg-gray-100 overflow-hidden cursor-pointer hover:border-gray-400 transition-colors"
          (click)="fileInputEdit.click()"
          (keydown.enter)="fileInputEdit.click()"
          (keydown.space)="fileInputEdit.click()"
          tabindex="0"
          role="button"
          aria-label="Selecionar foto"
        >
          <img
            *ngIf="editFotoPreview"
            [src]="editFotoPreview"
            alt="Preview da foto do usuário"
            class="w-full h-full object-cover"
          />
          <div
            *ngIf="!editFotoPreview"
            class="w-full h-full flex items-center justify-center text-gray-400 text-sm"
          >
            <i class="pi pi-camera text-xl"></i>
          </div>
        </div>

        <input
          #fileInputEdit
          type="file"
          accept="image/*"
          (change)="onEditFileSelect($event)"
          class="hidden"
        />
      </div>

      <div class="flex flex-col">
        <label for="editNome" class="font-semibold text-gray-700 required">Nome Completo</label>
        <input
          type="text"
          id="editNome"
          formControlName="nome"
          pInputText
          placeholder="Nome completo"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(editForm, 'nome')"
        />
        <div *ngFor="let error of getFieldErrors(editForm, 'nome')" class="mt-1">
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col ">
        <label for="editLogin" class="font-semibold text-gray-700 required">Email/Login</label>
        <input
          type="email"
          id="editLogin"
          formControlName="login"
          pInputText
          placeholder="email@exemplo.com"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(editForm, 'login')"
        />
        <div *ngFor="let error of getFieldErrors(editForm, 'login')" class="mt-1">
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col ">
        <label for="editPassword" class="font-semibold text-gray-700">Nova Senha (opcional)</label>
        <input
          type="password"
          id="editPassword"
          formControlName="password"
          pInputText
          placeholder="Nova senha (deixe em branco para manter a atual)"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(editForm, 'password')"
        />
        <div *ngFor="let error of getFieldErrors(editForm, 'password')" class="mt-1">
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
        <small class="text-gray-500 mt-1" *ngIf="editForm.get('password')?.value">
          A senha deve conter: 1 maiúscula, 1 minúscula e 1 número (mínimo 6 caracteres)
        </small>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button
        pButton
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-text"
        (click)="closeEditDialog()"
      ></button>
      <button
        pButton
        label="Salvar"
        icon="pi pi-check"
        class="!bg-emerald-800 hover:bg-emerald-900 !border-emerald-700"
        (click)="salvarEdicao()"
        [disabled]="!editForm.valid"
      ></button>
    </ng-template>
  </p-dialog>

  <p-confirmDialog />
  <p-toast />
</div>
