<div class="p-8 mx-auto space-y-8">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg text-zinc-700">Gerenciar Usuários</h3>
    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Adicionar Usuário"
      class="!bg-emerald-800 hover:bg-emerald-900 !border-emerald-700"
      (click)="openAddUserDialog()"
    ></button>
  </div>

  <p-panel showHeader="false">
    <p-table
      #dt
      [value]="usuarios || []"
      [paginator]="true"
      [rows]="5"
      [loading]="loading"
      stripedRows
      scrollable="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="min-w-48">Nome</th>
          <th class="min-w-48">Email</th>
          <th class="min-w-32">Cargo</th>
          <th class="min-w-24">Foto</th>
          <th class="min-w-32">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-usuario let-i="rowIndex">
        <tr>
          <td [title]="usuario.name">{{ usuario.name }}</td>
          <td [title]="usuario.email">{{ usuario.email }}</td>
          <td [title]="getCargoLabel(usuario.role)">
            <span
              class="px-2 py-1 rounded-full text-xs font-medium"
              [class]="getCargoClass(usuario.role)"
            >
              {{ getCargoLabel(usuario.role) }}
            </span>
          </td>
          <td>
            <img
              *ngIf="usuario.photoUrl; else noPhoto"
              [src]="usuario.photoUrl"
              class="w-10 h-10 object-cover rounded-full"
              [alt]="'Foto de ' + usuario.name"
            />
            <ng-template #noPhoto>
              <div
                class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center"
              >
                <i class="pi pi-user text-gray-400"></i>
              </div>
            </ng-template>
          </td>
          <td>
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-text mr-2"
              (click)="editarUsuario(usuario, i)"
              pTooltip="Editar usuário"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-text"
              (click)="excluirUsuario($event, i)"
              pTooltip="Excluir usuário"
            ></button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">Nenhum usuário encontrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-panel>

  <p-dialog
    header="Adicionar Usuário"
    [(visible)]="addUserDialogVisible"
    [modal]="true"
    [style]="{ width: '500px' }"
    [closable]="true"
  >
    <form [formGroup]="usuarioForm" class="space-y-4">
      <div class="flex flex-col items-center space-y-3">
        <div
          class="w-32 h-32 rounded-full border-2 border-dashed border-gray-300 bg-gray-100 overflow-hidden cursor-pointer hover:border-gray-400 transition-colors"
          (click)="fileInput.click()"
          (keydown.enter)="fileInput.click()"
          (keydown.space)="fileInput.click()"
          tabindex="0"
          role="button"
          aria-label="Selecionar foto"
        >
          <img
            *ngIf="fotoPreview"
            [src]="fotoPreview"
            alt="Preview da foto do usuário"
            class="w-full h-full object-cover"
          />
          <div
            *ngIf="!fotoPreview"
            class="w-full h-full flex items-center justify-center text-gray-400 text-sm"
          >
            <i class="pi pi-camera text-2xl"></i>
          </div>
        </div>

        <input
          #fileInput
          type="file"
          accept="image/*"
          (change)="onFileSelect($event)"
          class="hidden"
        />

        <span class="text-xs text-gray-500">Clique para selecionar foto</span>
      </div>

      <div class="flex flex-col">
        <label for="nome" class="font-semibold text-gray-700 required"
          >Nome Completo</label
        >
        <input
          type="text"
          id="nome"
          formControlName="nome"
          pInputText
          placeholder="Nome completo"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(usuarioForm, 'nome')"
        />
        <div
          *ngFor="let error of getFieldErrors(usuarioForm, 'nome')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="login" class="font-semibold text-gray-700 required"
          >Email/Login</label
        >
        <input
          type="email"
          id="login"
          formControlName="login"
          pInputText
          placeholder="email@exemplo.com"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(usuarioForm, 'login')"
        />
        <div
          *ngFor="let error of getFieldErrors(usuarioForm, 'login')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="cargo" class="font-semibold text-gray-700 required"
          >Cargo</label
        >
        <p-dropdown
          id="cargo"
          formControlName="cargo"
          [options]="cargoOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione o cargo"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(usuarioForm, 'cargo')"
        />
        <div
          *ngFor="let error of getFieldErrors(usuarioForm, 'cargo')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="password" class="font-semibold text-gray-700 required"
          >Senha</label
        >
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            pInputText
            placeholder="Senha (min. 6 caracteres)"
            class="w-full pr-10"
            [class.ng-invalid]="isFieldInvalid(usuarioForm, 'password')"
          />
          <button
            type="button"
            class="password-toggle-btn absolute right-3 top-1/2 transform -translate-y-1/2"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
            aria-label="Mostrar/ocultar senha"
          >
            <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <div
          *ngFor="let error of getFieldErrors(usuarioForm, 'password')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label
          for="confirmPassword"
          class="font-semibold text-gray-700 required"
          >Confirmar Senha</label
        >
        <div class="relative">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            pInputText
            placeholder="Confirme sua senha"
            class="w-full pr-10"
            [class.ng-invalid]="isFieldInvalid(usuarioForm, 'confirmPassword') || (usuarioForm.errors?.['passwordMismatch'] && usuarioForm.get('confirmPassword')?.dirty)"
          />
          <button
            type="button"
            class="password-toggle-btn absolute right-3 top-1/2 transform -translate-y-1/2"
            (click)="toggleConfirmPasswordVisibility()"
            tabindex="-1"
            aria-label="Mostrar/ocultar confirmação de senha"
          >
            <i
              [class]="showConfirmPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"
            ></i>
          </button>
        </div>
        <div
          *ngFor="let error of getFieldErrors(usuarioForm, 'confirmPassword')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button
        pButton
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-text"
        (click)="closeAddUserDialog()"
      ></button>
      <button
        pButton
        label="Criar Usuário"
        icon="pi pi-check"
        class="!bg-emerald-800 hover:bg-emerald-900 !border-emerald-700"
        (click)="criarUsuario()"
        [loading]="isLoading"
        [disabled]="!usuarioForm.valid || isLoading"
      ></button>
    </ng-template>
  </p-dialog>

  <p-dialog
    header="Editar Usuário"
    [(visible)]="editDialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
    [closable]="true"
  >
    <form [formGroup]="editForm" class="space-y-4">
      <div class="flex flex-col items-center space-y-3">
        <div
          class="w-24 h-24 rounded-full border-2 border-dashed border-gray-300 bg-gray-100 overflow-hidden cursor-pointer hover:border-gray-400 transition-colors"
          (click)="fileInputEdit.click()"
          (keydown.enter)="fileInputEdit.click()"
          (keydown.space)="fileInputEdit.click()"
          tabindex="0"
          role="button"
          aria-label="Selecionar foto"
        >
          <img
            *ngIf="editFotoPreview"
            [src]="editFotoPreview"
            alt="Preview da foto do usuário"
            class="w-full h-full object-cover"
          />
          <div
            *ngIf="!editFotoPreview"
            class="w-full h-full flex items-center justify-center text-gray-400 text-sm"
          >
            <i class="pi pi-camera text-xl"></i>
          </div>
        </div>

        <input
          #fileInputEdit
          type="file"
          accept="image/*"
          (change)="onEditFileSelect($event)"
          class="hidden"
        />
      </div>

      <div class="flex flex-col">
        <label for="editNome" class="font-semibold text-gray-700 required"
          >Nome Completo</label
        >
        <input
          type="text"
          id="editNome"
          formControlName="nome"
          pInputText
          placeholder="Nome completo"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(editForm, 'nome')"
        />
        <div
          *ngFor="let error of getFieldErrors(editForm, 'nome')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="editLogin" class="font-semibold text-gray-700 required"
          >Email/Login</label
        >
        <input
          type="email"
          id="editLogin"
          formControlName="login"
          pInputText
          placeholder="email@exemplo.com"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(editForm, 'login')"
        />
        <div
          *ngFor="let error of getFieldErrors(editForm, 'login')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="editCargo" class="font-semibold text-gray-700 required"
          >Cargo</label
        >
        <p-dropdown
          id="editCargo"
          formControlName="cargo"
          [options]="cargoOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione o cargo"
          class="w-full"
          [class.ng-invalid]="isFieldInvalid(editForm, 'cargo')"
        />
        <div
          *ngFor="let error of getFieldErrors(editForm, 'cargo')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="editPassword" class="font-semibold text-gray-700"
          >Nova Senha (opcional)</label
        >
        <div class="relative">
          <input
            [type]="showEditPassword ? 'text' : 'password'"
            id="editPassword"
            formControlName="password"
            pInputText
            placeholder="Nova senha (deixe em branco para manter a atual)"
            class="w-full pr-10"
            [class.ng-invalid]="isFieldInvalid(editForm, 'password')"
          />
          <button
            type="button"
            class="password-toggle-btn absolute right-3 top-1/2 transform -translate-y-1/2"
            (click)="toggleEditPasswordVisibility()"
            tabindex="-1"
            aria-label="Mostrar/ocultar senha"
          >
            <i [class]="showEditPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <div
          *ngFor="let error of getFieldErrors(editForm, 'password')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>

      <div class="flex flex-col">
        <label for="editConfirmPassword" class="font-semibold text-gray-700"
          >Confirmar Nova Senha</label
        >
        <div class="relative">
          <input
            [type]="showEditConfirmPassword ? 'text' : 'password'"
            id="editConfirmPassword"
            formControlName="confirmPassword"
            pInputText
            placeholder="Confirme sua nova senha (deixe em branco para manter a atual)"
            class="w-full pr-10"
            [class.ng-invalid]="isFieldInvalid(editForm, 'confirmPassword') || (editForm.errors?.['passwordMismatch'] && editForm.get('confirmPassword')?.dirty)"
          />
          <button
            type="button"
            class="password-toggle-btn absolute right-3 top-1/2 transform -translate-y-1/2"
            (click)="toggleEditConfirmPasswordVisibility()"
            tabindex="-1"
            aria-label="Mostrar/ocultar confirmação de senha"
          >
            <i
              [class]="
                showEditConfirmPassword ? 'pi pi-eye-slash' : 'pi pi-eye'
              "
            ></i>
          </button>
        </div>
        <div
          *ngFor="let error of getFieldErrors(editForm, 'confirmPassword')"
          class="mt-1"
        >
          <p-message
            severity="error"
            [text]="error"
            variant="simple"
          ></p-message>
        </div>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button
        pButton
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-text"
        (click)="closeEditDialog()"
      ></button>
      <button
        pButton
        label="Salvar"
        icon="pi pi-check"
        class="!bg-emerald-800 hover:bg-emerald-900 !border-emerald-700"
        (click)="salvarEdicao()"
        [disabled]="!editForm.valid"
      ></button>
    </ng-template>
  </p-dialog>

  <p-confirmDialog />
  <p-toast />
</div>
